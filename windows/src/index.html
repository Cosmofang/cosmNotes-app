<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self';">
  <title>cosmNotes</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="model.js"></script>
  <script defer src="view.js"></script>
</head>
<body>
  <header id="toolbar"></header>
  <nav id="tabs" aria-label="视图"></nav>
  <main id="content"></main>
  <footer id="footer"></footer>
  <dialog id="dialog">
    <form id="editor">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" type="button" aria-label="取消" title="取消">×</button>
      </div>
      <div id="fields"></div>
      <p id="form-error" role="alert"></p>
      <div class="form-actions">
        <button id="cancel" type="button">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>
  <div role="status" id="toast"></div>
</body>
</html>
